<h2 mat-dialog-title>{{ dialogTitle }}</h2>
<mat-dialog-content>
  <p>{{ data.mensagem }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">
    {{ data.botaoCancelar || 'Cancelar' }}
  </button>
  <button
    mat-raised-button
    [color]="data.isDangerous ? 'warn' : 'primary'"
    (click)="confirmar()"
  >
    {{ data.botaoConfirmar || 'Confirmar' }}
  </button>
</mat-dialog-actions>
